[package]
name = "number-eight"
version = "0.1.0"
description = "A local visual library for media and links"
repository = "https://github.com/alexlohinov/number-eight"
edition = "2021"

[lib]
name = "number_eight"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
png = "=0.18.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
scraper = "=0.27.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
trash = "5"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4", "v5"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
